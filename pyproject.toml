[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refguard"
version = "0.1.0"
description = "Reference Integrity & Citation Quality Checker (source-aware evidence fusion)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "RefGuard Contributors" }]
keywords = ["bibliography", "citation", "bibtex", "verification", "academic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bibtexparser>=1.4",
    "cachetools>=5.3",
    "fastapi>=0.104",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "requests>=2.28",
    "scikit-learn>=1.3",
    "Unidecode>=1.3",
    "uvicorn[standard]>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1"]

[project.scripts]
refcheck = "refguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["refguard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
