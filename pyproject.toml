[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refguard"
version = "0.1.0"
description = "学术参考文献身份核验工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "RefGuard Contributors" }]
keywords = ["bibliography", "citation", "bibtex", "verification", "academic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bibtexparser>=1.4",
    "cachetools>=5.3",
    "fastapi>=0.104",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "Unidecode>=1.3",
    "uvicorn[standard]>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1"]

[project.scripts]
refguard = "refguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["refguard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
